<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>预选排行榜 · 第六届南科奏音</title>
<style>
:root{color-scheme:light;--ink-0:#20262d;--slate:#262e36;--slate-2:#333e48;--mute:#63778a;--line:#d5dae1;--card:#eef0f4;--orange:#f99e1a;--orange-2:#f06414;--yellow:#f8c13a;font:16px/1.5 "Source Han Sans CN","Noto Sans SC","Microsoft YaHei",sans-serif;color:var(--ink-0);background:#e4e7ec}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(118deg,transparent 0 58%,#ffffffa6 58% 61%,transparent 61% 100%),linear-gradient(118deg,transparent 0 14%,#ffffff8c 14% 24%,transparent 24% 100%),linear-gradient(118deg,transparent 0 76%,#c9ced666 76% 88%,transparent 88%),linear-gradient(180deg,#f3f4f7,#dcdfe5);background-attachment:fixed}
body::before,body::after{content:"";position:fixed;z-index:0;pointer-events:none;background:linear-gradient(90deg,var(--orange),var(--orange-2))}
body::before{left:0;bottom:0;width:min(30vw,380px);height:150px;clip-path:polygon(0 38%,100% 0,100% 14%,0 70%,0 100%,0 82%,62% 58%,62% 66%,0 92%)}
body::after{right:0;top:32%;width:min(16vw,200px);height:240px;clip-path:polygon(100% 0,100% 18%,0 58%,22% 46%)}
.topbar{position:sticky;top:0;z-index:5;background:#fffffff0;backdrop-filter:blur(6px);box-shadow:0 1px 0 #0000000f,0 6px 18px #2a32400d;overflow:hidden}
.topbar::before{content:"";position:absolute;left:0;top:0;width:230px;height:100%;background:linear-gradient(118deg,#ffe3b5 0 42%,transparent 42%);opacity:.9;pointer-events:none}
.mast{position:relative;display:flex;align-items:center;gap:clamp(16px,4vw,56px);max-width:1180px;min-height:76px;margin:auto;padding:0 clamp(14px,3vw,32px)}
.brand{display:flex;gap:11px;align-items:center;font-size:20px;font-weight:900;letter-spacing:.06em;white-space:nowrap;color:var(--ink-0)}
.brand img{display:block;width:40px;height:40px;flex:none;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px var(--orange)}
nav{display:flex;align-items:stretch;align-self:stretch;gap:clamp(4px,1.4vw,22px);overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav a{position:relative;flex:none;display:grid;place-items:center;padding:0 10px;color:#7a8692;text-decoration:none;font-size:17px;font-weight:800;transition:color .15s}
nav a::after{content:"";position:absolute;left:6px;right:6px;bottom:0;height:4px;background:var(--orange-2);transform:scaleX(0);transition:transform .2s}
nav a:hover{color:var(--ink-0)}nav a[aria-current]{color:var(--ink-0)}nav a[aria-current]::after{transform:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--orange-2);outline-offset:2px}
main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:0 0 64px}
.spread{min-height:calc(100vh - 76px);background:#fff;padding:22px clamp(12px,3.2vw,36px) 40px;box-shadow:0 0 40px #2a32401a}
header{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto 1fr;column-gap:24px;align-items:start;padding:26px clamp(18px,3vw,34px) 28px;background:linear-gradient(118deg,transparent 0 55%,#ffffff0d 55% 70%,transparent 70%),linear-gradient(90deg,var(--slate),var(--slate-2));color:#fff}
header::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(#ffffff14 1px,transparent 1.4px) 0 0/7px 7px;-webkit-mask:linear-gradient(118deg,transparent 60%,#000 85%);mask:linear-gradient(118deg,transparent 60%,#000 85%)}
header::after{content:"";position:absolute;left:0;bottom:0;width:38%;height:5px;background:linear-gradient(90deg,var(--orange),var(--orange-2));clip-path:polygon(0 0,100% 0,calc(100% - 6px) 100%,0 100%)}
header p{justify-self:start;margin:0;padding:3px 14px;background:var(--yellow);color:#20170e;font-size:14px;font-weight:900;letter-spacing:.08em;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
h1{margin:12px 0 4px;font-size:clamp(34px,5.2vw,60px);font-weight:900;line-height:1.08;letter-spacing:.01em;font-style:italic;overflow-wrap:anywhere;text-shadow:0 3px 0 #0000004d}
.game{color:var(--yellow);font-size:clamp(15px,1.6vw,19px);font-weight:800;letter-spacing:.06em}
.game-icons{grid-column:2;grid-row:1/4;align-self:center;display:flex;gap:12px;padding:10px;background:linear-gradient(135deg,var(--light),var(--accent));clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.game-icons img{display:block;width:clamp(72px,11vw,124px);height:auto;aspect-ratio:1;object-fit:contain;border-radius:20%;box-shadow:0 4px 14px #10151c40}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 8px}
.bar h2{position:relative;margin:0;padding-left:18px;font-size:clamp(22px,2.6vw,28px);font-weight:900;font-style:italic}
.bar h2::before{content:"";position:absolute;left:0;top:18%;bottom:18%;width:8px;background:var(--orange-2);transform:skewX(-14deg)}
#status{display:inline-flex;align-items:center;padding:6px 14px;background:var(--slate);color:var(--yellow);font-size:13px;font-weight:700;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#status[data-state=live]::before{content:"";width:7px;height:7px;border-radius:50%;background:#ffb43a;box-shadow:0 0 0 3px #ffb43a33;margin-right:8px;animation:pulse 1.6s infinite}
#empty{color:var(--mute);font-size:14px}
table{width:100%;border-spacing:0 6px;table-layout:fixed;text-align:left}
th,td{padding:0 clamp(10px,2vw,24px)}
th{height:34px;font-size:13px;font-weight:700;color:var(--mute);letter-spacing:.06em}
th:first-child{width:18%}th:last-child{width:36%}th:last-child,td:last-child{text-align:right}
tbody tr{--metal:var(--slate-2);--metal-ink:#fff;background:linear-gradient(118deg,var(--card) 0 64%,#e5e8ed 64% 78%,var(--card) 78%)}
tbody tr:hover{background:linear-gradient(118deg,#e8ebf0 0 64%,#dde1e7 64% 78%,#e8ebf0 78%)}
td{height:52px;font-weight:700}
td:first-child{border-left:4px solid transparent}
td:nth-child(2){overflow-wrap:anywhere;font-size:17px}
td:last-child,.rank{font-family:"Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;font-variant-numeric:tabular-nums}
td:last-child{font-size:22px;font-weight:700;font-style:italic;color:var(--ink-0)}
.rank{display:inline-grid;place-items:center;width:54px;height:32px;background:var(--metal);color:var(--metal-ink);font-size:18px;font-style:italic;font-weight:700;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
tr[data-medal="1"]{--metal:linear-gradient(135deg,#ffe08a,#f8b81c);--metal-ink:#3a2500;--edge:#f8b81c}
tr[data-medal="2"]{--metal:linear-gradient(135deg,#f1f4f8,#aab6c4);--metal-ink:#1f2933;--edge:#a3b0bf}
tr[data-medal="3"]{--metal:linear-gradient(135deg,#ffc9a3,#d97a45);--metal-ink:#3b1a07;--edge:#d97a45}
tr[data-medal]{background:linear-gradient(118deg,#fff 0 60%,#f3f4f7 60% 76%,#fff 76%);box-shadow:inset 0 0 0 1px var(--line)}
tr[data-medal] td{height:64px}tr[data-medal] td:first-child{border-left-color:var(--edge)}
tr[data-medal] td:nth-child(2){font-size:clamp(18px,1.9vw,22px);font-weight:900}
tr[data-medal] td:last-child{font-size:clamp(24px,2.8vw,32px)}
tr[data-medal] .rank{width:64px;height:38px;font-size:22px}
.champion{display:grid;gap:14px;margin-top:22px}
.winner{position:relative;overflow:hidden;padding:0 0 clamp(26px,3vw,38px);background:linear-gradient(118deg,var(--card) 0 60%,#e4e7ec 60% 76%,var(--card) 76%)}
.winner::after{content:"";position:absolute;right:0;bottom:0;width:30%;height:100%;background:radial-gradient(#9aa4b033 1px,transparent 1.4px) 0 0/7px 7px;-webkit-mask:linear-gradient(118deg,transparent 30%,#000);mask:linear-gradient(118deg,transparent 30%,#000)}
.winner p{margin:0 0 clamp(14px,2vw,22px);padding:10px clamp(16px,2.6vw,28px);background:var(--slate);color:var(--yellow);font-size:15px;font-weight:800;letter-spacing:.1em}
.winner strong{position:relative;z-index:1;display:block;padding:0 clamp(16px,2.6vw,28px);font-size:clamp(38px,6vw,72px);font-weight:900;font-style:italic;line-height:1.1;color:var(--ink-0)}
.winner strong::before{content:"";display:inline-block;width:.16em;height:.8em;margin-right:.3em;background:var(--orange-2);transform:skewX(-14deg)}
button{font:inherit;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--orange),var(--orange-2));border:0;padding:10px 30px;margin-top:14px;cursor:pointer;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}button:hover{filter:brightness(1.06)}
[hidden]{display:none!important}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:no-preference){.moved .rank{animation:rank-flash 1.3s ease-out}@keyframes rank-flash{15%{filter:brightness(1.6);transform:scale(1.08)}}}
@media(prefers-reduced-motion:reduce){#status[data-state=live]::before{animation:none}}
@media(max-width:760px){.mast{flex-direction:column;align-items:stretch;gap:0;padding-top:10px}.brand{font-size:18px}.brand img{width:32px;height:32px}nav{min-height:48px;gap:2px}nav a{font-size:15px;padding:0 10px}.topbar::before{width:150px}.spread{padding:14px 10px 30px}header{column-gap:14px;padding:18px 16px 22px}.game-icons{padding:7px;gap:6px}.game-icons img{width:64px}.game-icons img:not(:only-child){width:44px}.bar{flex-wrap:wrap}th:first-child{width:22%}th:last-child{width:38%}td:nth-child(2){font-size:15px}td:last-child{font-size:18px}.rank{width:44px;height:28px;font-size:15px}tr[data-medal] .rank{width:50px;height:32px;font-size:18px}tr[data-medal] td{height:56px}body::before,body::after{opacity:.6}}

<script>
const select=s=>document.querySelector(s);
let previousRanks=new Map();
async function sync(resume=false){
 select('#resume').hidden=true;
 try {
  const response=await fetch('/api/ranking',{method:resume?'POST':'GET',cache:'no-store'});
  const {data,error}=await response.json();
  if(data){
    const fragment=document.createDocumentFragment();
    for(const row of data.rows.slice(0,16)){
      const tr=document.createElement('tr'),badge=document.createElement('span');
      if(previousRanks.has(row.name)&&previousRanks.get(row.name)!==row.rank) tr.className='moved';
      if(row.rank<=3) tr.dataset.medal=String(row.rank);
      badge.className='rank';badge.textContent=String(row.rank).padStart(2,'0');tr.insertCell().append(badge);
      tr.insertCell().textContent=row.name;tr.insertCell().textContent=row.score.toLocaleString('zh-CN');fragment.append(tr);
    }
    select('tbody').replaceChildren(fragment);
    previousRanks=new Map(data.rows.map(row=>[row.name,row.rank]));
    select('#status').dataset.state='live';
    select('#empty').hidden=data.rows.length>0;
    select('#status').textContent='最近同步 '+new Date(data.updated).toLocaleTimeString('zh-CN',{hour12:false});
  }
  if(error||!response.ok) throw Error(error||'数据源异常');
  setTimeout(sync,30000);
 }catch(err){delete select('#status').dataset.state;select('#status').textContent='同步暂停 · '+err.message;select('#resume').hidden=false}
}
const editions={
 '1':{title:'节奏大师比赛',winners:[['冠军','六苯乙烷']],colors:['#142f34','#50d3ae','#c9ffe6'],icons:['rhythm']},
 '2':{title:'Phigros 比赛',winners:[['冠军','哆啦小鱼']],colors:['#242040','#b29df9','#f4dcff'],icons:['phigros']},
 '3':{title:'Arcaea 娱乐赛',winners:[['冠军','QX']],colors:['#34253f','#e5a3de','#fbe4f8'],icons:['arcaea']},
 '4':{title:'PJSK 比赛',winners:[['冠军','陟']],colors:['#0d383c','#54e4da','#defff2'],icons:['pjsk']},
 osu:{title:'osu! 比赛',period:'第四届与第五届之间',note:'赛事中途停办',colors:['#412338','#f199c3','#ffe1ee'],icons:['osu']},
 '5':{title:'舞萌中二娱乐赛',winners:[['舞萌冠军','terry'],['中二冠军','拉点林安']],colors:['#392d1e','#f4b65b','#ffebad'],icons:['maimai', 'chunithm']},
 '6':{title:'线上预选排行榜',game:'Phigros',colors:['#534c81','#aa9af5','#dbe2ff'],icons:['phigros']}
};
const requested=new URL(location.href).searchParams.get('edition');
const edition=Object.hasOwn(editions,requested)?requested:'6';
const eventInfo=editions[edition];
const current=select('nav a[href="?edition='+edition+'"]');
current.setAttribute('aria-current','page');
const nav=current.parentElement;
if(nav.scrollWidth>nav.clientWidth) nav.scrollLeft=current.offsetLeft-nav.offsetLeft-(nav.clientWidth-current.offsetWidth)/2;
['--ink','--accent','--light'].forEach((v,i)=>document.body.style.setProperty(v,eventInfo.colors[i]));
select('header p').textContent=eventInfo.period||current.textContent+'南科奏音';
const gameTitles={'1':'节奏大师','2':'Phigros','3':'Arcaea','4':'PJSK','5':'舞萌中二',osu:'osu!'};
select('h1').textContent=eventInfo.game||gameTitles[edition];
select('.game').textContent=eventInfo.game?eventInfo.title:eventInfo.title.replace(gameTitles[edition],'').trim();
document.title=select('header p').textContent+' · '+(eventInfo.game||'')+eventInfo.title;
const iconNames={rhythm:'节奏大师',phigros:'Phigros',arcaea:'Arcaea',pjsk:'PJSK',osu:'osu!',maimai:'舞萌 DX',chunithm:'中二节奏'};
for(const key of eventInfo.icons){
 const icon=document.createElement('img');
 icon.src='/icons/'+key+'.webp';
 icon.alt=iconNames[key]+' 图标';
 select('.game-icons').append(icon);
}
if(edition==='6'){
 select('#resume').onclick=()=>sync(true);
 sync();
}else{
 select('#live').hidden=true;
 const history=select('#history');
 for(const [label,name] of eventInfo.winners||[['赛事状态',eventInfo.note]]){
  const card=document.createElement('article'),caption=document.createElement('p'),winner=document.createElement('strong');
  card.className='winner';caption.textContent=label;winner.textContent=name;
  card.append(caption,winner);history.append(card);
 }
 history.hidden=false;
}
</script></html>
